<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Au Rendez-Vous</title>
  <meta name="description" content="Boîte à outils du Café Au Rendez-Vous : avis, posts, pubs.">
  <meta name="theme-color" content="#1F2366">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Rendez-Vous">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="stylesheet" href="style.css">
  <script src="config.js"></script>
</head>
<body>
  <header class="comptoir">
    <div class="enseigne">
      <span class="enseigne-nom" data-t="app.title">Au Rendez-Vous</span>
      <span class="enseigne-sous" data-t="app.subtitle">My toolbox</span>
    </div>
    <div class="langues" role="group" aria-label="Langue / Language">
      <button type="button" data-lang="fr">FR</button>
      <button type="button" data-lang="en">EN</button>
    </div>
  </header>

  <p class="bandeau-demo" id="bandeau-demo" hidden data-t="demo.banner"></p>

  <main id="ecran" tabindex="-1"></main>

  <nav class="onglets" aria-label="Menu">
    <button type="button" data-onglet="avis"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M5 3h14v18l-2.3-1.6L14.3 21 12 19.4 9.7 21l-2.4-1.6L5 21z"/><path d="M8.5 8h7M8.5 12h7M8.5 16h4"/></svg><span data-t="tab.reviews">Reviews</span></button>
    <button type="button" data-onglet="posts"><svg aria-hidden="true" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="14" rx="1.5"/><circle cx="9" cy="10" r="1.8"/><path d="m4 17 5-4.5 4 3.5 3-2.5 4 3.5"/></svg><span data-t="tab.posts">Posts</span></button>
    <button type="button" data-onglet="pubs"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span data-t="tab.ads">Ads</span></button>
    <button type="button" data-onglet="ecrire"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 20h4L19.5 8.5a2.1 2.1 0 0 0-3-3L5 17z"/><path d="m14.5 7.5 3 3"/></svg><span data-t="tab.write">Write</span></button>
    <button type="button" data-onglet="fiche"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 10.5 12 4l8 6.5V20H4z"/><path d="M9.5 20v-5.5h5V20"/></svg><span data-t="tab.profile">Profile</span></button>
  </nav>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
